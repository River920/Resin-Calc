<!DOCTYPE html>
<html lang="en">
<body>

    <h3>Resin Calculator</h3>
    <h3>Calculate your resin. AU$/KG</h3>
    <p id="out"></p>


    <button onclick="calcFunction()">Calculate</button>
    <script>
        function calcFunction() {
            let amt = prompt("Please enter amount of resin(Kgs):", "0");
            let aud = amt*2


            document.getElementById("out").innerHTML = "Output(aud$): " + aud;

        }
        

    </script>
